name: Release

# Push a tag vX.Y.Z (after `node scripts/release.mjs set X.Y.Z` and a commit) to publish a GitHub release
# with the VS Code extension and the standalone CLI, then the same .vsix to the VS Code Marketplace
# (Trusted Publishing: no stored token; see CONTRIBUTING.md). Open VSX publishing runs once the
# OVSX_PAT secret exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version matches the tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          node scripts/release.mjs check "${GITHUB_REF_NAME#v}"
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:vscode
      - name: Collect assets
        run: |
          mkdir out
          cp packages/vscode/stet-vscode.vsix "out/stet-vscode-$VERSION.vsix"
          cp packages/vscode/dist/stet.mjs "out/stet-$VERSION.mjs"
          node "out/stet-$VERSION.mjs" --help > /dev/null
          (cd out && sha256sum * > SHA256SUMS.txt)
          node scripts/release.mjs notes "$VERSION" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Stet $VERSION" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: out/stet-vscode-${{ env.VERSION }}.vsix
          if-no-files-found: error
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "out/stet-vscode-$VERSION.vsix" -p "$OVSX_PAT"

  # The .vsix the release job built and tested, to the VS Code Marketplace. The Marketplace trusts
  # this workflow file of this repository (a Trusted Publishing policy on the publisher), so only
  # this job gets an OIDC token; it runs no tests or build scripts. --skip-duplicate: a re-run
  # after the version is already live succeeds.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - name: Publish to the VS Code Marketplace
        run: npm exec -w stet-vscode -- vsce publish --oidc --skip-duplicate --packagePath "$GITHUB_WORKSPACE/out/stet-vscode-${GITHUB_REF_NAME#v}.vsix"
