name: CI

on:
  push:
  pull_request:

jobs:
  # Full build and tests. The test runner (vitest 5) needs Node.js 22.12 or newer.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
        shell: bash
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node packages/cli/dist/index.js --help
          node packages/cli/dist/index.js doctor || true

  # Stet itself supports Node.js 20: build it there and run the CLI.
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI runs on Node.js 20
        run: |
          node packages/cli/dist/index.js --help
          node packages/vscode/dist/stet.mjs --help

  # The VS Code extension package, downloadable from the workflow run.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: stet-vscode-vsix
          path: packages/vscode/stet-vscode.vsix
