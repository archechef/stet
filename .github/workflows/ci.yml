name: CI

on:
  push:
  pull_request:

jobs:
  # Full build and tests. The test runner (vitest 5) needs Node.js 22.12 or newer.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
        shell: bash
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node packages/cli/dist/index.js --help
          node packages/cli/dist/index.js doctor || true
          node packages/vscode/dist/stet.mjs --help

  # Lint, formatting and the tests' types: the same on every platform, so checked once.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - run: npm run typecheck

  # The VS Code extension package, downloadable from the workflow run.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: stet-vscode-vsix
          path: packages/vscode/stet-vscode.vsix
